name: Season theme visual review
on:
  pull_request:
    paths:
      - index.html
      - assets/bean-around/**
      - tests/season-theme-browser.cjs
      - .github/workflows/season-theme-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      REVIEW_IMAGE_LOG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated visual test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps "$BROWSER"
      - name: Compare layout and capture actual game
        run: node tests/season-theme-browser.cjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-theme-${{ matrix.browser }}
          path: artifacts/season-theme/
          if-no-files-found: warn
          retention-days: 14
