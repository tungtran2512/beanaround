<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" preserveAspectRatio="none">
<title>Bean Around café interior — shared quiet background</title>
<desc>Original illustration: warm limewash plaster, oak shelves, glazed ceramics, coffee jars, window and brass pendants. Center deliberately clear for the live machine and cup.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#d6bd9e"/><stop offset=".55" stop-color="#f4e6cc"/><stop offset="1" stop-color="#d9bf9c"/></linearGradient>
 <linearGradient id="oak" x2="0" y2="1"><stop stop-color="#c1996d"/><stop offset=".18" stop-color="#9c704a"/><stop offset=".5" stop-color="#ad8158"/><stop offset="1" stop-color="#704c35"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#a6b6ac" stop-opacity=".65"/><stop offset=".22" stop-color="#edf0d7" stop-opacity=".42"/><stop offset=".58" stop-color="#829489" stop-opacity=".4"/><stop offset="1" stop-color="#5d6f62" stop-opacity=".65"/></linearGradient>
 <linearGradient id="glaze"><stop stop-color="#a3987e"/><stop offset=".23" stop-color="#f4efdd"/><stop offset=".66" stop-color="#ddd7bc"/><stop offset="1" stop-color="#b0a792"/></linearGradient>
 <linearGradient id="brass"><stop stop-color="#715c3e"/><stop offset=".24" stop-color="#c5ad78"/><stop offset=".5" stop-color="#e6d29a"/><stop offset=".8" stop-color="#9c8353"/><stop offset="1" stop-color="#746042"/></linearGradient>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b0c1be"/><stop offset="1" stop-color="#e8e4c6"/></linearGradient>
 <linearGradient id="windowShade"><stop stop-color="#897754" stop-opacity=".25"/><stop offset=".4" stop-color="#fff5ce" stop-opacity=".12"/><stop offset="1" stop-color="#fff6d9" stop-opacity=".65"/></linearGradient>
 <radialGradient id="amber"><stop stop-color="#fff1bf" stop-opacity=".65"/><stop offset=".45" stop-color="#f3d697" stop-opacity=".2"/><stop offset="1" stop-color="#f3d697" stop-opacity="0"/></radialGradient>
 <radialGradient id="roomLight"><stop stop-color="#fff8e7" stop-opacity=".95"/><stop offset=".65" stop-color="#fff8e7" stop-opacity=".5"/><stop offset="1" stop-color="#fff8e7" stop-opacity="0"/></radialGradient>
 <linearGradient id="vignette"><stop stop-color="#513c29" stop-opacity=".12"/><stop offset=".35" stop-color="#513c29" stop-opacity="0"/><stop offset=".7" stop-color="#513c29" stop-opacity="0"/><stop offset="1" stop-color="#513c29" stop-opacity=".1"/></linearGradient>
 <pattern id="plaster" width="90" height="76" patternUnits="userSpaceOnUse"><path d="M6 14q14-6 25 2m32 28 18-3M18 67l23-3" fill="none" stroke="#a99170" stroke-width=".8" opacity=".13"/><path d="M8 43l18-2m21-22 16 1m-13 48 14 1" fill="none" stroke="#fff9e8" stroke-width="1.3" opacity=".4"/></pattern>
 <pattern id="grain" width="180" height="38" patternUnits="userSpaceOnUse"><path d="M-10 8q58-5 98 0t112-1M-9 19q78 6 128-1t90 2M21 29q21-4 65-1m20 2 46-1" fill="none" stroke="#694831" stroke-width="1" opacity=".15"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1000" height="600" fill="url(#wall)"/><rect width="1000" height="600" fill="url(#plaster)"/>
<!-- subdued oak wall panel, not a foreground border -->
<path d="M0 346H1000V600H0Z" fill="#b69570"/><path d="M0 347H1000M0 358H1000" stroke="#8f704f" stroke-width="5"/>
<g stroke="#8f704f" stroke-width="2" opacity=".25"><path d="M40 360V600M98 360V600M156 360V600M214 360V600M272 360V600M330 360V600M388 360V600M446 360V600M504 360V600M562 360V600M620 360V600M678 360V600M736 360V600M794 360V600M852 360V600M910 360V600M968 360V600"/></g>
<!-- Window: only the background receives cold/sun treatments -->
<rect x="751" y="39" width="219" height="319" rx="5" fill="#75664d"/><rect x="760" y="48" width="199" height="298" rx="2" fill="url(#sky)"/>
<g filter="url(#soft)" opacity=".47" fill="#768b72"><ellipse cx="787" cy="254" rx="63" ry="92"/><ellipse cx="916" cy="281" rx="58" ry="129"/><ellipse cx="849" cy="331" rx="90" ry="49"/></g>
<path d="M774 310h170v26H774Z" fill="#a99b80" opacity=".5"/><path d="M759 50H959V346H759Z" fill="url(#windowShade)"/>
<path d="M858 45V350M758 193H961" fill="none" stroke="#a8906c" stroke-width="9"/>
<path d="M762 53V344M863 52V343M762 199H956" stroke="#efe0ba" stroke-width="2" opacity=".7"/>
<path d="M738 351H975V365H738Z" fill="url(#oak)"/>
<!-- Left shelf shadow, jars, ceramics and modest chalkboard -->
<path d="M14 160H282V178H14M22 284H267V302H22" stroke="#65503a" stroke-width="12" opacity=".13" filter="url(#soft)"/>
<g stroke="#7e6b4d" stroke-width="2">
 <rect x="37" y="88" width="49" height="67" rx="6" fill="url(#glass)"/><path d="M40 126Q62 117 83 126V151H40Z" fill="#5e4b36" stroke="none"/><rect x="36" y="80" width="51" height="11" rx="3" fill="url(#oak)"/><path d="M45 97v28" stroke="#f5edcc" opacity=".6"/><rect x="45" y="113" width="33" height="20" rx="2" fill="#d7c4a0" stroke="none"/>
 <rect x="99" y="100" width="44" height="55" rx="5" fill="url(#glass)"/><rect x="97" y="91" width="48" height="11" rx="3" fill="url(#oak)"/><path d="M103 130h36v22h-36" fill="#705640" stroke="none"/><rect x="107" y="115" width="28" height="19" rx="2" fill="#d9c9ab" stroke="none"/>
 <path d="M160 117h40l-4 35h-32Z" fill="url(#glaze)"/><path d="M199 122h8q12 10-8 20" fill="none" stroke="#ada68f" stroke-width="5"/>
 <path d="M213 130h36l-4 24h-29Z" fill="#8b4b45"/><path d="M246 133h7q8 8-7 14" fill="none" stroke="#8b4b45" stroke-width="5"/>
</g>
<path d="M15 157H281V170H15Z" fill="url(#oak)"/><path d="M20 158H277" stroke="#dfbd87" stroke-width="2"/>
<path d="M38 170v16h15v-16m188 0v16h15v-16" stroke="#514c42" fill="none" stroke-width="4"/>
<g transform="translate(26 199)">
 <path d="M5 2L89 0L96 74L0 77Z" fill="#94704d"/><path d="M12 9L82 7L87 67L8 69Z" fill="#4a5549"/>
 <path d="M23 25h46m-37 13h29m-37 13h47" stroke="#eee7d0" stroke-width="2" opacity=".47"/>
 <path d="M126 16h27v63h-27Z" fill="#bd8d54" opacity=".85"/><path d="M132 0h16v19h-16Z" fill="#43493f"/><path d="M141 2h19" stroke="#43493f" stroke-width="5"/><rect x="128" y="43" width="23" height="22" rx="2" fill="#e7d6b5"/>
 <path d="M173 36h24v43h-24Z" fill="#85684b"/><path d="M178 18h14v21h-14Z" fill="#4d5348"/><path d="M184 21h17" stroke="#4d5348" stroke-width="5"/><rect x="175" y="49" width="20" height="17" fill="#d9c6a3"/>
</g>
<path d="M22 281H267V295H22Z" fill="url(#oak)"/><path d="M25 282H264" stroke="#dfbd87" stroke-width="2"/>
<!-- Small pendant lights are at the margins, center remains intentionally quiet -->
<g><ellipse cx="286" cy="110" rx="103" ry="121" fill="url(#amber)"/><path d="M283 0v49" stroke="#6b5c42" stroke-width="3"/><path d="M245 73Q284 20 324 73Z" fill="url(#brass)" stroke="#8e7750" stroke-width="2"/><ellipse cx="285" cy="74" rx="40" ry="7" fill="#dcc68f"/><ellipse cx="285" cy="74" rx="28" ry="4" fill="#fff2c6"/>
<ellipse cx="702" cy="107" rx="103" ry="130" fill="url(#amber)"/><path d="M701 0v47" stroke="#6b5c42" stroke-width="3"/><path d="M675 72Q701 30 728 72Z" fill="url(#brass)" stroke="#8e7750" stroke-width="2"/><ellipse cx="702" cy="73" rx="27" ry="5" fill="#fff0c0"/></g>
<!-- Ambient light keeps the machine silhouette the strongest contrast -->
<ellipse cx="508" cy="320" rx="286" ry="257" fill="url(#roomLight)"/>
<rect width="1000" height="600" fill="url(#vignette)"/>
<!-- Back worktop and a softly reflected edge; live countertop is a separate layer -->
<path d="M0 475H1000V600H0Z" fill="url(#oak)"/><path d="M0 477H1000" stroke="#ead3a8" stroke-width="7" opacity=".7"/><path d="M0 488H1000V600H0Z" fill="url(#grain)"/>
</svg>